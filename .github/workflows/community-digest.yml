---
name: Weekly community digest

# The one scheduled piece. Every Monday it counts what actually happened in the
# last 7 days and appends it to the log — because the honest failure mode for a
# community is not "nobody came", it is "nobody noticed that nobody came".
#
# Writes `community/status.md` and commits it. No numbers are invented: if a
# count cannot be fetched, the cell says so.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count the last 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)

          # The window is applied in Python below, not in the query: GraphQL
          # rejects a declared-but-unused variable ($since), and filtering
          # locally keeps the window explicit where the counts are computed.
          data=$(gh api graphql -f query='
            query {
              repository(owner:"aegiscloud-devs", name:"aegiscode") {
                discussions(first:100, orderBy:{field:UPDATED_AT, direction:DESC}) {
                  nodes {
                    number title createdAt updatedAt
                    category { name }
                    comments(first:100) { totalCount nodes { createdAt } }
                  }
                }
              }
            }')

          echo "$data" > /tmp/gql.json

          python3 - "$since" <<'PY'
          import json, sys, datetime, pathlib
          since = sys.argv[1]
          nodes = json.load(open('/tmp/gql.json'))['data']['repository']['discussions']['nodes']

          def recent(ts): return ts >= since

          new_threads = [n for n in nodes if recent(n['createdAt'])]
          answered = [n for n in nodes
                      if any(recent(c['createdAt']) for c in n['comments']['nodes'])]
          # A thread with zero comments after 7 days is the number that matters:
          # it is the measure of "someone asked and nobody was there".
          silent = [n for n in new_threads if n['comments']['totalCount'] == 0]

          today = datetime.date.today().isoformat()
          lines = [
              f"\n## {today}\n",
              f"- New threads: **{len(new_threads)}**",
              f"- Threads receiving a reply: **{len(answered)}**",
              f"- New threads with no reply after 7 days: **{len(silent)}**",
              f"- Total threads on record: {len(nodes)}",
              "",
          ]
          if silent:
              lines.append("Unanswered new threads (the number to act on):\n")
              for n in silent:
                  lines.append(f"- #{n['number']} {n['title']} — {n['category']['name']}")
              lines.append("")

          p = pathlib.Path('community/status.md')
          p.parent.mkdir(parents=True, exist_ok=True)
          if not p.exists():
              p.write_text("# Community status — weekly counts\n\n"
                           "Generated by `.github/workflows/community-digest.yml`.\n"
                           "Counts only. No targets here — a target is not a result.\n")
          with p.open('a') as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community/status.md
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(community): weekly digest $(date -u +%Y-%m-%d)"
          git push
